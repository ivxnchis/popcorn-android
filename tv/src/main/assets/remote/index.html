<!DOCTYPE html>
<!--
  Page served to phones and computers on the same network as the TV, see RemoteLinkServer.
  Placeholders in double braces are filled in by RemoteLinkManager (translated strings) and RemoteLinkServer (status).
-->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{title}}</title>
<style>
  :root {
    --background: #202129;
    --surface: #2b2d38;
    --text: #f1f1f1;
    --muted: #a6a8b6;
    --primary: #3f51b5;
    --primary-pressed: #303f9f;
    --ok: #7bd88f;
    --error: #ff8a80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 560px; padding: 32px 16px; }
  h1 { font-size: 24px; font-weight: 500; margin: 0 0 4px; }
  p { margin: 0 0 24px; color: var(--muted); }
  label { display: block; font-weight: 500; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    border: 1px solid #444757;
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
    resize: vertical;
    word-break: break-all;
  }
  textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
  button, .file {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
  }
  button:active, .file:active { background: var(--primary-pressed); }
  button:disabled { opacity: .6; cursor: default; }
  .file { position: relative; background: var(--surface); border: 1px dashed #5c6070; }
  .file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file:focus-within { outline: 2px solid var(--primary); }
  .or { display: flex; align-items: center; gap: 12px; margin: 24px 0 12px; color: var(--muted); }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid #444757; }
  .status { min-height: 24px; margin-top: 24px; font-weight: 500; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.error { color: var(--error); }
  .logs { margin-top: 48px; font-size: 14px; }
  .logs a { color: var(--muted); }
  body.dragging main { outline: 2px dashed var(--primary); outline-offset: 8px; border-radius: 8px; }
</style>
</head>
<body data-sending="{{sending}}" data-failed="{{failed}}">
<main>
  <h1>{{heading}}</h1>
  <p>{{intro}}</p>

  <form id="link-form" method="post" action="send">
    <label for="link">{{link_label}}</label>
    <textarea id="link" name="link" placeholder="{{link_hint}}" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" required></textarea>
    <button type="submit">{{send}}</button>
  </form>

  <div class="or">{{or}}</div>

  <form id="file-form" method="post" action="send" enctype="multipart/form-data">
    <label class="file">
      <input id="torrent" type="file" name="torrent">
      <span>{{choose_file}}</span>
    </label>
    <noscript><button type="submit">{{send}}</button></noscript>
  </form>

  <div id="status" class="status {{status_class}}" role="status" aria-live="polite">{{status}}</div>

  <p class="logs"><a href="logs">{{logs}}</a> · <a href="logs?download=1">{{logs_download}}</a></p>
</main>
<script>
(function () {
  var linkForm = document.getElementById('link-form');
  var link = document.getElementById('link');
  var fileForm = document.getElementById('file-form');
  var file = document.getElementById('torrent');
  var status = document.getElementById('status');
  var texts = document.body.dataset;
  var sending = false;

  function show(message, ok) {
    status.textContent = message;
    status.className = 'status' + (ok === undefined ? '' : ok ? ' ok' : ' error');
  }

  function send(body, contentType, form) {
    if (sending) return;
    sending = true;
    show(texts.sending);
    var headers = { 'Accept': 'application/json' };
    if (contentType) headers['Content-Type'] = contentType;
    fetch('send', { method: 'POST', body: body, headers: headers })
      .then(function (response) { return response.json(); })
      .then(function (result) {
        show(result.message, result.ok);
        if (result.ok) form.reset();
      })
      .catch(function () { show(texts.failed, false); })
      .then(function () { sending = false; });
  }

  function sendLink() {
    if (!link.value.trim()) return;
    // url-encoded rather than multipart, so names with accents in magnet links arrive intact
    send('link=' + encodeURIComponent(link.value), 'application/x-www-form-urlencoded; charset=utf-8', linkForm);
  }

  function sendFile(torrent) {
    var data = new FormData();
    data.append('torrent', torrent);
    send(data, null, fileForm);
  }

  linkForm.addEventListener('submit', function (event) {
    event.preventDefault();
    sendLink();
  });

  link.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendLink();
    }
  });

  file.addEventListener('change', function () {
    if (file.files.length) sendFile(file.files[0]);
  });

  // drop a .torrent file or a link from another tab anywhere on the page
  document.addEventListener('dragover', function (event) {
    event.preventDefault();
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragleave', function (event) {
    if (!event.relatedTarget) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', function (event) {
    event.preventDefault();
    document.body.classList.remove('dragging');
    var data = event.dataTransfer;
    if (data.files && data.files.length) {
      sendFile(data.files[0]);
      return;
    }
    var text = data.getData('text/uri-list') || data.getData('text/plain');
    if (text) {
      link.value = text.trim();
      sendLink();
    }
  });
})();
</script>
</body>
</html>
